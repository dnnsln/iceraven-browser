name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 手动初始化子模块
      - name: Manual Submodule Initialization
        run: |
          echo "=== 手动初始化子模块 ==="
          
          # 1. 删除现有目录
          rm -rf android-components
          
          # 2. 手动克隆主子模块
          echo "克隆android-components..."
          git clone --depth=1 --recursive https://github.com/mozilla-mobile/android-components.git
          
          # 3. 进入并检查publicsuffixlist
          cd android-components
          echo "检查publicsuffixlist..."
          if [ ! -d "plugins/publicsuffixlist" ]; then
            echo "手动初始化publicsuffixlist..."
            cd plugins
            git clone --depth=1 https://github.com/mozilla-mobile/publicsuffixlist.git
            cd ..
          fi
          cd ..
          
          # 4. 验证
          echo "验证目录结构..."
          find . -name "*.gradle*" | head -10

      # 3. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 5. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 6. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      # 7. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
