name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 手动初始化子模块（更健壮版本）
      - name: Manual Submodule Initialization
        run: |
          echo "=== 手动初始化子模块 ==="
          echo "当前目录: $(pwd)"
          echo "目录内容:"
          ls -la
          
          # 检查 .gitmodules 文件
          echo "检查 .gitmodules 文件..."
          if [ -f ".gitmodules" ]; then
            cat .gitmodules
            echo "---"
          fi
          
          # 删除现有目录
          echo "删除现有 android-components 目录..."
          rm -rf android-components
          
          # 手动克隆主子模块
          echo "克隆 android-components 仓库..."
          git clone --depth=1 --branch main https://github.com/mozilla-mobile/android-components.git
          
          # 检查是否克隆成功
          if [ ! -d "android-components" ]; then
            echo "错误: android-components 克隆失败!"
            exit 1
          fi
          
          # 进入并检查publicsuffixlist
          cd android-components
          echo "当前在 android-components 目录: $(pwd)"
          echo "检查 plugins 目录..."
          ls -la plugins/ || echo "plugins 目录不存在，创建它..."
          mkdir -p plugins
          
          echo "检查 publicsuffixlist..."
          if [ ! -d "plugins/publicsuffixlist" ]; then
            echo "手动初始化 publicsuffixlist..."
            cd plugins
            git clone --depth=1 https://github.com/mozilla-mobile/publicsuffixlist.git
            cd ..
          else
            echo "publicsuffixlist 已存在"
          fi
          
          cd ..
          
          # 最终验证
          echo "=== 最终验证 ==="
          echo "android-components 目录结构:"
          ls -la android-components/
          echo "---"
          echo "android-components/plugins 目录结构:"
          ls -la android-components/plugins/
          echo "---"
          if [ -d "android-components/plugins/publicsuffixlist" ]; then
            echo "✓ publicsuffixlist 存在!"
            ls -la android-components/plugins/publicsuffixlist/
          else
            echo "✗ 错误: publicsuffixlist 仍然不存在!"
          fi

      # 3. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks
          echo "密钥库文件大小: $(wc -c < my-release-key.jks) bytes"

      # 5. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 6. 先尝试调试构建（查看任务）
      - name: Debug Gradle Tasks
        run: |
          echo "=== 可用的Gradle任务 ==="
          ./gradlew tasks --all || true

      # 7. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace

      # 8. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
