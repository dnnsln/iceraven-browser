name: Build Signed Release APK

on:
  workflow_dispatch: # 允许在GitHub网页上手动点击触发
  push:
    branches: [ main ] # 推送到main分支时自动触发（可选）

jobs:
  build:
    runs-on: ubuntu-latest # 使用GitHub提供的Linux虚拟机环境

    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置Java环境（Ice Raven项目通常需要JDK 11或17）
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 解码Base64编码的密钥库文件，还原为 .jks 文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks
        shell: bash

      # 4. 给Gradle包装脚本执行权限（Linux环境需要）
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 5. 构建并签名Release版APK
      #    关键：通过 -P 参数将Secrets传递给Gradle脚本
      - name: Build Signed APK
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      # 6. 上传生成的APK作为工作流产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/ # APK默认输出路径
