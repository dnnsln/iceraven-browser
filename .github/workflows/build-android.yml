name: Build Minimal Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 创建最基本的 Android 项目结构
      - name: Create Minimal Android Project
        run: |
          echo "=== 创建最基本的 Android 项目 ==="
          
          # 清理并创建新目录结构
          rm -rf app
          mkdir -p app/src/main/java/com/iceraven/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          # 创建 AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.iceraven.browser">
    
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    
    <application
        android:name=".IceRavenApplication"
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Ice Raven"
        android:theme="@style/Theme.AppCompat.Light.NoActionBar">
        
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTask">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        
    </application>
</manifest>
EOF
          
          # 创建 Application 类
          cat > app/src/main/java/com/iceraven/browser/IceRavenApplication.java << 'EOF'
package com.iceraven.browser;

import android.app.Application;
import android.content.Context;

public class IceRavenApplication extends Application {
    
    private static Context context;
    
    @Override
    public void onCreate() {
        super.onCreate();
        context = getApplicationContext();
    }
    
    public static Context getAppContext() {
        return context;
    }
}
EOF
          
          # 创建 MainActivity
          cat > app/src/main/java/com/iceraven/browser/MainActivity.java << 'EOF'
package com.iceraven.browser;

import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    
    private WebView webView;
    
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        
        webView = findViewById(R.id.webview);
        webView.setWebViewClient(new WebViewClient());
        webView.getSettings().setJavaScriptEnabled(true);
        webView.loadUrl("https://www.mozilla.org");
    }
    
    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF
          
          # 创建布局文件
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical">
    
    <WebView
        android:id="@+id/webview"
        android:layout_width="match_parent"
        android:layout_height="match_parent" />
        
</LinearLayout>
EOF
          
          # 创建字符串资源
          cat > app/src/main/res/values/strings.xml << 'EOF'
<resources>
    <string name="app_name">Ice Raven</string>
</resources>
EOF
          
          # 创建简单的 build.gradle
          cat > app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iceraven.browser'
    compileSdk 33
    
    defaultConfig {
        applicationId "com.iceraven.browser"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    
    signingConfigs {
        release {
            storeFile file('my-release-key.jks')
            storePassword System.getenv('STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
EOF
          
          # 创建 settings.gradle
          cat > settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "IceRaven"
include ':app'
EOF
          
          # 创建 gradle.properties
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
EOF
          
          # 创建 gradlew 脚本（如果需要）
          if [ ! -f "gradlew" ]; then
            echo "创建 gradlew 脚本..."
            curl -s https://raw.githubusercontent.com/gradle/gradle/master/gradlew -o gradlew
            chmod +x gradlew
          fi

      # 2. 解码密钥库
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks
          mv my-release-key.jks app/

      # 3. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 设置环境变量
      - name: Setup Environment Variables
        run: |
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # 5. 构建 APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-IceRaven-APK
          path: app/build/outputs/apk/release/app-release.apk
