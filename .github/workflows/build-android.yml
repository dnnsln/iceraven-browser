name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 更新到主版本 v4 (推荐且稳定)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 更新到主版本 v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 解码Base64编码的密钥库文件，还原为 .jks 文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 4. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 5. 构建并签名Release版APK (使用了 forkRelease 变体，很好！)
      - name: Build Signed APK
        run: |
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      # 6. 上传生成的APK (已更新为v4，关键：修正输出路径！)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          # 路径应根据 fork 变体调整！如果此路径不存在，构建会成功但上传会报错。
          path: app/build/outputs/apk/fork/release/
