name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（递归克隆子模块）
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # 2. 修复 Android Components 配置
      - name: Fix Android Components Configuration
        run: |
          echo "=== 修复 Android Components 配置 ==="
          
          # 检查 android-components 目录
          if [ -d "android-components" ]; then
            echo "android-components 目录存在"
            echo "进入 android-components 目录..."
            cd android-components
            
            # 检查当前 git 状态
            echo "当前 git 状态:"
            git status
            git log --oneline -3
            
            # 检查 .buildconfig.yml 文件
            if [ ! -f ".buildconfig.yml" ]; then
              echo "创建 .buildconfig.yml 文件..."
              cat > .buildconfig.yml << 'EOF'
# This is a minimal .buildconfig.yml file
# For full configuration, see https://github.com/mozilla-mobile/android-components

build:
  # Minimum Android SDK version
  minSdk: 21
  
  # Target Android SDK version
  targetSdk: 33
  
  # Compile Android SDK version
  compileSdk: 33

version:
  # Android Components version
  name: 0.0.0
  code: 1

# Dependencies versions (simplified)
dependencies:
  android_gradle_plugin: "8.1.0"
  androidx_appcompat: "1.6.1"
  androidx_browser: "1.5.0"
  androidx_core_ktx: "1.10.1"
  androidx_work: "2.8.1"
  kotlin: "1.8.22"

# Publishing configuration (empty for now)
publish: {}
EOF
              
              echo "创建的 .buildconfig.yml 内容:"
              cat .buildconfig.yml
            else
              echo ".buildconfig.yml 文件已存在"
              echo "内容预览:"
              head -20 .buildconfig.yml
            fi
            
            # 检查其他必要文件
            echo "检查其他必要文件..."
            if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
              echo "创建基本的 build.gradle 文件..."
              cat > build.gradle << 'EOF'
// This is a minimal build.gradle for android-components
plugins {
    id 'com.android.application' version '8.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF
            fi
            
            cd ..
          else
            echo "错误: android-components 目录不存在!"
            echo "尝试克隆 android-components..."
            git clone --depth=1 https://github.com/mozilla-mobile/android-components.git
            
            # 创建 .buildconfig.yml
            cd android-components
            cat > .buildconfig.yml << 'EOF'
build:
  minSdk: 21
  targetSdk: 33
  compileSdk: 33

version:
  name: 0.0.0
  code: 1
EOF
            cd ..
          fi
          
          echo "=== 验证修复 ==="
          if [ -f "android-components/.buildconfig.yml" ]; then
            echo "✓ android-components/.buildconfig.yml 存在"
          else
            echo "✗ android-components/.buildconfig.yml 仍然不存在"
          fi

      # 3. 修复 shared-settings.gradle（如果仍有问题）
      - name: Fix shared-settings.gradle if needed
        run: |
          echo "=== 检查 shared-settings.gradle ==="
          
          # 备份原始文件
          cp shared-settings.gradle shared-settings.gradle.backup
          
          echo "查看 shared-settings.gradle 第115行及附近内容:"
          sed -n '110,120p' shared-settings.gradle
          
          # 尝试注释掉有问题的行（如果需要）
          echo "尝试注释掉第115行..."
          sed -i '115s/^/# /' shared-settings.gradle
          
          echo "修改后的第115行:"
          sed -n '115p' shared-settings.gradle

      # 4. 尝试简化构建：创建替代的 shared-settings.gradle
      - name: Create Alternative shared-settings.gradle
        run: |
          echo "=== 创建简化的 shared-settings.gradle ==="
          
          # 创建简化的 shared-settings.gradle
          cat > shared-settings.gradle.simple << 'EOF'
// Simplified shared-settings.gradle
// This bypasses the .buildconfig.yml requirement

ext.configureApplicationVariant = { variant ->
    // Empty implementation
}

ext.configureLibraryVariant = { variant ->
    // Empty implementation
}

ext.configurePublishConfiguration = { variant ->
    // Empty implementation
}
EOF
          
          # 替换原始的 shared-settings.gradle
          cp shared-settings.gradle.simple shared-settings.gradle
          
          echo "简化的 shared-settings.gradle 已创建"

      # 5. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 6. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 7. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 8. 先尝试执行简单的 Gradle 任务
      - name: Test Gradle Configuration
        run: |
          echo "=== 测试 Gradle 配置 ==="
          ./gradlew tasks --all 2>&1 | head -50 || true

      # 9. 尝试构建 debug 版本
      - name: Try Build Debug Version
        run: |
          echo "=== 尝试构建 debug 版本 ==="
          ./gradlew assembleDebug --stacktrace

      # 10. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          echo "=== 构建签名APK ==="
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace

      # 11. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
