name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 显示关键信息
      - name: Show Critical Info
        run: |
          echo "=== settings.gradle 第31行 ==="
          sed -n '31p' settings.gradle
          echo ""
          echo "=== 第31行上下文 ==="
          sed -n '25,35p' settings.gradle
          echo ""
          echo "=== 当前目录结构 ==="
          ls -la
          echo ""
          echo "=== 检查android-components是否存在 ==="
          ls -la android-components/ || echo "android-components目录不存在"

      # 3. 尝试修复子模块（如果android-components不存在）
      - name: Fix Submodule
        run: |
          if [ ! -d "android-components" ]; then
            echo "android-components不存在，尝试克隆..."
            git clone --depth=1 https://github.com/mozilla-mobile/android-components.git
          fi
          if [ ! -d "android-components/plugins/publicsuffixlist" ]; then
            echo "publicsuffixlist不存在，尝试克隆..."
            mkdir -p android-components/plugins
            cd android-components/plugins
            git clone --depth=1 https://github.com/mozilla-mobile/publicsuffixlist.git
            cd ../..
          fi

      # 4. 如果上述步骤失败，则修改settings.gradle
      - name: Modify settings.gradle if needed
        run: |
          if [ ! -d "android-components/plugins/publicsuffixlist" ]; then
            echo "publicsuffixlist仍然不存在，将修改settings.gradle"
            # 备份
            cp settings.gradle settings.gradle.bak
            # 注释掉第31行
            sed -i '31s/^/#/' settings.gradle
            echo "已注释掉第31行"
          else
            echo "publicsuffixlist存在，无需修改settings.gradle"
          fi

      # 5. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 6. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 7. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 8. 尝试构建（不签名，先测试）
      - name: Test Build (unsigned)
        run: |
          echo "=== 测试构建（不签名）==="
          ./gradlew assembleDebug --stacktrace || true

      # 9. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          echo "=== 构建签名APK ==="
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace

      # 10. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
