name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 获取关键诊断信息
      - name: Critical Diagnostic
        run: |
          echo "=== 关键诊断信息 ==="
          echo "1. 查看 settings.gradle 第31行及周围内容:"
          sed -n '25,40p' settings.gradle
          
          echo ""
          echo "2. 查看整个 settings.gradle 文件:"
          cat settings.gradle
          
          echo ""
          echo "3. 查看 .gitmodules 文件:"
          cat .gitmodules || echo "没有 .gitmodules 文件"
          
          echo ""
          echo "4. 当前目录结构:"
          find . -maxdepth 3 -type d | sort
          
          echo ""
          echo "5. 检查 android-components 是否存在:"
          ls -la android-components/ || echo "android-components 目录不存在"

      # 3. 手动设置复合构建
      - name: Setup Composite Build Manually
        run: |
          echo "=== 手动设置复合构建 ==="
          
          # 1. 删除现有的 android-components
          rm -rf android-components
          
          # 2. 克隆 android-components
          echo "克隆 android-components..."
          git clone --depth=1 https://github.com/mozilla-mobile/android-components.git
          
          # 3. 进入 android-components
          cd android-components
          
          # 4. 克隆 publicsuffixlist（作为独立的Gradle项目）
          echo "设置 publicsuffixlist..."
          if [ ! -d "plugins" ]; then
            mkdir -p plugins
          fi
          
          cd plugins
          echo "克隆 publicsuffixlist 仓库..."
          git clone --depth=1 https://github.com/mozilla-mobile/publicsuffixlist.git
          
          # 5. 确保 publicsuffixlist 有必要的构建文件
          cd publicsuffixlist
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "警告: publicsuffixlist 没有构建文件，这可能是个问题"
            echo "尝试查找构建文件..."
            find . -name "*.gradle*" -type f
          fi
          cd ../../..
          
          # 6. 验证
          echo "验证设置:"
          if [ -d "android-components/plugins/publicsuffixlist" ]; then
            echo "✓ publicsuffixlist 目录存在"
            echo "目录内容:"
            ls -la android-components/plugins/publicsuffixlist/
          else
            echo "✗ publicsuffixlist 目录不存在"
          fi

      # 4. 备选方案：修改 settings.gradle
      - name: Alternative Fix - Modify settings.gradle
        run: |
          echo "=== 备选方案：修改 settings.gradle ==="
          
          # 备份原文件
          cp settings.gradle settings.gradle.backup
          
          echo "原始 settings.gradle 第31行内容:"
          sed -n '31p' settings.gradle
          
          # 尝试注释掉有问题的行
          echo "尝试注释掉第31行（如果包含publicsuffixlist）..."
          sed -i '31s/^/# /' settings.gradle
          
          echo "修改后的 settings.gradle 第31行内容:"
          sed -n '31p' settings.gradle
          
          echo "检查是否还有其他引用..."
          grep -n "publicsuffixlist" settings.gradle || echo "没有其他引用"

      # 5. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 6. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 7. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 8. 尝试构建（不签名，先测试）
      - name: Test Build (unsigned)
        run: |
          echo "=== 测试构建（不签名）==="
          ./gradlew assembleDebug --stacktrace || true

      # 9. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          echo "=== 构建签名APK ==="
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace

      # 10. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
