name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码并初始化子模块
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0  # 获取完整历史，有助于子模块初始化

      # 2. 更彻底地初始化子模块（包括嵌套子模块）
      - name: Setup Submodules
        run: |
          echo "开始初始化子模块..."
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth=1
          
          echo "检查 android-components 子模块..."
          if [ -d "android-components" ]; then
            echo "进入 android-components 目录..."
            cd android-components
            echo "当前目录: $(pwd)"
            echo "初始化 android-components 的内部子模块..."
            git submodule sync --recursive
            git submodule update --init --recursive --force --depth=1
            echo "android-components 子模块状态:"
            git submodule status
            cd ..
          else
            echo "错误: android-components 目录不存在!"
          fi
          
          echo "所有子模块状态:"
          git submodule status --recursive

      # 3. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 解码Base64编码的密钥库文件
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 5. 给Gradle包装脚本执行权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 6. 构建并签名Release版APK
      - name: Build Signed APK
        run: |
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'

      # 7. 上传生成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Fork-Release-APK
          path: app/build/outputs/apk/fork/release/
