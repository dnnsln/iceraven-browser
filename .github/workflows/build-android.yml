      # 替代的修复步骤
      - name: Aggressive Fix - Modify shared-settings.gradle
        run: |
          echo "=== 激进修复：修改 shared-settings.gradle ==="
          
          # 备份原始文件
          cp shared-settings.gradle shared-settings.gradle.backup
          
          # 完全重写有问题的部分
          # 首先找到问题行附近的内容
          echo "查找 .buildconfig.yml 相关代码..."
          grep -n "\.buildconfig\.yml" shared-settings.gradle
          
          # 创建一个修复版的 shared-settings.gradle
          cat > shared-settings.gradle.fixed << 'EOF'
// Fixed version of shared-settings.gradle
// This version bypasses the .buildconfig.yml requirement

def loadBuildConfig = { acPath ->
    def buildconfigFile = new File("$topsrcdir/$acPath/.buildconfig.yml")
    if (buildconfigFile.exists()) {
        try {
            def yaml = new org.yaml.snakeyaml.Yaml()
            return yaml.load(buildconfigFile.newInputStream())
        } catch (Exception e) {
            println "WARNING: Failed to load .buildconfig.yml from $acPath: ${e.message}"
            return null
        }
    } else {
        println "WARNING: .buildconfig.yml not found at $acPath, using defaults"
        return [
            build: [
                min_sdk: 21,
                target_sdk: 33,
                compile_sdk: 33
            ],
            version: [
                name: "0.0.0",
                code: 1
            ]
        ]
    }
}

// ... rest of the original file after line 115 ...
EOF
          
          # 现在我们需要将原文件的前114行和修复后的部分合并
          head -114 shared-settings.gradle > shared-settings.gradle.new
          cat shared-settings.gradle.fixed >> shared-settings.gradle.new
          
          # 替换原文件
          mv shared-settings.gradle.new shared-settings.gradle
          
          echo "修复完成，新的 shared-settings.gradle 已创建"
