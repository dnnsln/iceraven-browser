name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检查代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 验证 settings.gradle 文件
      - name: Verify settings.gradle
        run: |
          echo "检查 settings.gradle 文件..."
          head -40 settings.gradle
          echo ""
          echo "检查第31行:"
          sed -n '31p' settings.gradle

      # 3. 设置Java环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 解码密钥库
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > my-release-key.jks

      # 5. 给 gradlew 权限
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 6. 尝试构建 debug 版本
      - name: Try Debug Build
        run: |
          ./gradlew assembleDebug --stacktrace

      # 7. 构建签名版本
      - name: Build Signed Release
        run: |
          ./gradlew assembleForkRelease \
            -PKEYSTORE_FILE=my-release-key.jks \
            -PKEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' \
            --stacktrace

      # 8. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-APK
          path: app/build/outputs/apk/fork/release/
